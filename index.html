<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Расписание ИСАА — найти своё</title>
<style>
  :root{
    --ink:#1f2a24;
    --paper:#faf7f0;
    --card:#ffffff;
    --accent:#8a5a3b;
    --accent-soft:#f1e3d3;
    --line:#e2d9c8;
    --day-bg:#e9efe6;
    --muted:#6b6459;
    --warn:#b3452c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family: "PT Serif", Georgia, "Times New Roman", serif;
    line-height:1.5;
    padding: 28px 16px 80px;
  }
  .wrap{max-width:880px;margin:0 auto;}
  h1{
    font-size: clamp(28px, 5vw, 40px);
    margin: 0 0 6px;
    font-weight: 700;
    letter-spacing:-0.01em;
  }
  .subtitle{color:var(--muted); font-size:19px; margin:0 0 20px;}
  .mode-toggle{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:18px;}
  .mode-btn{
    flex:1; min-width:170px; font-family:inherit; font-size:18px; font-weight:700;
    padding:14px; border-radius:12px; border:2px solid var(--accent); cursor:pointer;
    background:#fff; color:var(--accent);
  }
  .mode-btn.active{background:var(--accent); color:#fff;}
  .picker-row{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
  .picker-btn{
    font-family:inherit; font-size:16px; font-weight:700;
    padding:10px 16px; border-radius:8px; border:2px solid var(--line); cursor:pointer;
    background:#fff; color:var(--ink);
  }
  .picker-btn.active{background:var(--accent); border-color:var(--accent); color:#fff;}
  .room-result-section{margin-top:24px;}
  .room-result-heading{font-size:19px; font-weight:700; margin-bottom:10px;}
  .room-chip-list{display:flex; flex-wrap:wrap; gap:8px;}
  .room-chip{
    display:inline-flex; flex-direction:column; padding:8px 14px; border-radius:10px; font-size:15px;
  }
  .room-chip.free{background:#e2efe0; color:#2c5a28; border:1px solid #b9d9b4;}
  .room-chip.busy{background:#f0ece4; color:var(--ink); border:1px solid var(--line);}
  .room-chip b{font-size:17px;}
  .room-chip small{color:var(--muted); margin-top:2px;}
  .search-box{
    background:var(--card);
    border:2px solid var(--line);
    border-radius:14px;
    padding:20px;
    box-shadow: 0 2px 0 var(--line);
    position:relative;
  }
  label{display:block; font-size:20px; font-weight:700; margin-bottom:10px;}
  input[type=text]{
    width:100%; font-size:24px; font-family: inherit;
    padding:14px 16px; border:2px solid var(--accent); border-radius:10px;
    background:#fff; color:var(--ink);
  }
  input[type=text]:focus{outline: 4px solid var(--accent-soft); outline-offset: 1px;}
  .hint{font-size:16px; color:var(--muted); margin-top:10px;}

  .suggest-list{
    margin-top:2px; background:#fff; border:2px solid var(--accent); border-top:none;
    border-radius:0 0 10px 10px; max-height:340px; overflow-y:auto; display:none;
  }
  .suggest-list.open{display:block;}
  .suggest-item{
    display:block; width:100%; text-align:left; background:none; border:none;
    border-bottom:1px solid var(--line); padding:14px 16px;
    font-family:inherit; font-size:20px; color:var(--ink); cursor:pointer;
  }
  .suggest-item:last-child{border-bottom:none;}
  .suggest-item:hover, .suggest-item:focus{background:var(--accent-soft);}

  .browse{margin-top:18px;}
  .browse-toggle{
    font-family:inherit; font-size:19px; font-weight:700;
    background:var(--accent-soft); border:2px solid var(--accent); color:var(--ink);
    border-radius:10px; padding:12px 20px; cursor:pointer; width:100%;
  }
  .browse-list{display:none; margin-top:14px; columns: 2; column-gap: 20px;}
  .browse-list.open{display:block;}
  @media (max-width:600px){ .browse-list{columns:1;} }
  .letter-heading{
    font-weight:700; font-size:18px; color:var(--accent); margin: 14px 0 4px;
    break-after: avoid; break-inside: avoid;
  }
  .browse-name{
    display:block; width:100%; text-align:left; background:none; border:none;
    font-family:inherit; font-size:18px; color:var(--ink); padding:6px 0; cursor:pointer;
    break-inside: avoid;
  }
  .browse-name:hover, .browse-name:focus{color:var(--accent); text-decoration:underline;}

  .clear-btn{
    display:none; margin-top:14px; font-family:inherit; font-size:17px; background:none;
    border:2px solid var(--line); color:var(--muted); border-radius:10px; padding:10px 18px; cursor:pointer;
  }
  .clear-btn.show{display:inline-block;}

  .status{font-size:19px; margin:22px 0 10px; color:var(--muted);}
  .status b{color:var(--ink);}
  .day-group{margin-top:22px;}
  .day-title{
    display:inline-block; background:var(--day-bg); color:var(--ink);
    font-size:20px; font-weight:700; padding:6px 16px; border-radius:999px; margin-bottom:10px;
  }
  .card{
    background:var(--card); border:1px solid var(--line); border-left:6px solid var(--accent);
    border-radius:10px; padding:16px 18px; margin-bottom:12px;
  }
  .row1{display:flex; flex-wrap:wrap; align-items:baseline; gap:10px 18px; margin-bottom:6px;}
  .time{font-size:22px; font-weight:700; color:var(--accent); min-width:110px;}
  .discipline{font-size:20px; font-weight:700;}
  .details{font-size:17px; color:var(--ink);}
  .details .lbl{color:var(--muted);}
  .group-code{
    font-family: "SFMono-Regular", Menlo, Consolas, monospace; font-size:15px;
    background:var(--accent-soft); padding:2px 8px; border-radius:6px;
    display:inline-block; margin:2px 4px 2px 0;
  }
  .group-link{
    border:0; cursor:pointer; color:var(--ink); text-align:left;
  }
  .group-link:hover, .group-link:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .teacher-link{
    font-family:inherit; font-size:17px; color:var(--accent); background:none; border:none;
    padding:0; cursor:pointer; text-decoration:underline; text-underline-offset:3px;
  }
  .teacher-link:hover{color:var(--warn);}
  .room-warn{color:var(--warn); font-weight:700;}
  .room-row{margin-top:8px;}
  .room-pill{
    display:inline-block; font-size:15px; padding:5px 12px; border-radius:8px; line-height:1.4;
  }
  .room-sure{
    background:#e2efe0; color:#2c5a28; font-weight:700; border:1px solid #b9d9b4;
  }
  .room-guess{
    background:#fdf6e8; color:#8a6d1f; border:1px dashed #d9bf6e;
  }
  .room-guess em{font-style:normal; opacity:0.85;}
  .room-unknown{
    background:#f0ece4; color:var(--muted); border:1px dashed var(--line);
  }
  .card-conflict{
    border-left-color: var(--warn);
    background:#fff5f2;
    box-shadow: 0 0 0 2px #f0b4a3;
  }
  .conflict-warn{
    margin-top:8px; background:#fbe1db; color:#8a2f18; border:1px solid #e3a894;
    border-radius:8px; padding:8px 12px; font-size:15px; font-weight:700;
  }
  .card-joint{
    border-left-color:#5b6fc7;
    background:#f4f6ff;
    box-shadow:0 0 0 2px #cbd3f5;
  }
  .joint-reading{
    margin-top:8px; background:#e8edff; color:#354a9f; border:1px solid #aebbea;
    border-radius:8px; padding:8px 12px; font-size:15px; font-weight:700;
  }
  .code-warn{
    margin-top:8px; background:#fff4cf; color:#6f5710; border:1px solid #e1c86a;
    border-radius:8px; padding:8px 12px; font-size:14px; font-weight:700;
  }
  .quality-tag{
    display:inline-block; margin-top:8px; font-size:13px; padding:3px 10px; border-radius:999px;
  }
  .q-ok{background:#e2efe0; color:#3a6b35;}
  .q-draft{background:#fbe9df; color:#a34a1f;}
  .empty{text-align:center; padding:50px 20px; color:var(--muted); font-size:19px;}
  .legend{margin-top:40px; padding-top:20px; border-top:1px solid var(--line); font-size:15px; color:var(--muted);}
  @media (max-width: 480px){ .time{min-width:auto;} }

  .pdf-btn{
    display:none;
    font-family:inherit; font-size:18px; font-weight:700;
    background:var(--ink); color:#fff; border:none;
    border-radius:10px; padding:12px 22px; cursor:pointer;
    margin: 18px 0 4px;
  }
  .pdf-btn.show{display:inline-flex; align-items:center; gap:8px;}
  .pdf-btn:hover{background:var(--accent);}
  .print-title{display:none;}

  @media print{
    .search-box, .browse, .pdf-btn, .legend, .hint, .mode-toggle{display:none !important;}
    body{padding:0; background:#fff;}
    .print-title{
      display:block; font-size:24px; font-weight:700; margin-bottom:4px;
    }
    .card{break-inside: avoid; page-break-inside: avoid; border-left-width:4px;}
    .day-group{break-inside:auto; page-break-inside:auto;}
    .day-title{break-after:avoid; page-break-after:avoid;}
    .room-chip{break-inside: avoid;}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Найти своё расписание</h1>
  <p class="subtitle">Осенний семестр 2026–2027, ИСАА МГУ</p>

  <div class="mode-toggle">

    <button class="mode-btn" id="modeRoom" type="button">Аудитория</button>
  </div>

  <div class="search-box" id="searchBoxNormal">
    <label id="qLabel" for="q">Впишите свою фамилию</label>

    <div id="suggestList" class="suggest-list"></div>
    <button class="clear-btn" id="clearBtn">✕ Показать заново</button>
  </div>

  <div class="search-box" id="searchBoxRoom" style="display:none;">
    <label>Выберите день и время</label>
    <div class="picker-row" id="dayPicker"></div>
    <div class="picker-row" id="timePicker"></div>
    <div class="picker-row">
      <button class="picker-btn" id="showAllRoomsBtn" type="button">Показать все аудитории</button>
      <button class="picker-btn" id="resetRoomBtn" type="button">✕ Сбросить</button>
    </div>
  </div>

  <div class="browse" id="browseBlock">
    <button class="browse-toggle" id="browseToggle">Показать список всех преподавателей</button>
    <div class="browse-list" id="browseList"></div>
  </div>

  <div id="status" class="status"></div>
  <div id="printTitle" class="print-title"></div>
  <button class="pdf-btn" id="pdfBtn">⬇ Скачать в PDF</button>
  <div id="results"></div>

</div>

// Only usable where the room hint is a SINGLE definite room (no comma-separated list of candidates).
function singleRoom(hint){
  if(!hint) return null;
  const h = hint.trim();
  const junk = ['', '—', '-', 'без ауд.', 'без аудитории'];
  if(!h || junk.includes(h) || h.includes('нет данных') || h.includes(',')) return null;
  return h;
}
function isJointReading(x){
  const txt = [
    (x && x.extra) || '',
    (x && x.quality) || ''
  ].join(' ').toLowerCase();
  return txt.includes('совместное чтение');
}

function getJointReaders(r){
  if(!isJointReading(r)) return [];

  if(Array.isArray(r.joint_readers)){
    return r.joint_readers.filter(Boolean);
  }

  const sameDiscipline = x => norm(x.discipline) === norm(r.discipline);
  const otherTeacher = x => (x.teacher || '').trim() && (x.teacher || '').trim() !== (r.teacher || '').trim();

  let peers = DATA.filter(x =>
    x !== r &&
    otherTeacher(x) &&
    sameDiscipline(x) &&
    x.day === r.day &&
    x.time === r.time
  );

  if(!peers.length && (r.day === 'уточняется' || r.time === 'уточняется')){
    peers = DATA.filter(x =>
      x !== r &&
      otherTeacher(x) &&
      sameDiscipline(x)
    );
  }

  return [...new Set(peers.map(x => (x.teacher || '').trim()).filter(Boolean))];
}

const roomIndex = {}; // "day|time|room" -> [{teacher, group, discipline}]
DATA.forEach(r => {
  const room = singleRoom(r.room_hint);
  if(!room) return;
  const key = r.day + '|' + r.time + '|' + room;
  if(!roomIndex[key]) roomIndex[key] = [];
  roomIndex[key].push({teacher: r.teacher, group: r.group, discipline: r.discipline, extra: r.extra || '', quality: r.quality || ''});
});
function findConflicts(r){
  const room = singleRoom(r.room_hint);
  if(!room) return [];
  const key = r.day + '|' + r.time + '|' + room;
  const entries = roomIndex[key] || [];
  const norm = s => (s || '').replace(/\s+/g,' ').trim().toLowerCase();
  return entries.filter(e => {
    if(e.teacher === r.teacher) return false;

    const alternatingGeneralLinguistics =
      r.discipline === 'Общее языкознание' &&
      e.discipline === 'Общее языкознание' &&
      r.group === e.group &&
      (
        ((r.extra || '').includes('1-я неделя') && (e.extra || '').includes('со 2-й недели')) ||
        ((e.extra || '').includes('1-я неделя') && (r.extra || '').includes('со 2-й недели'))
      );
    if(alternatingGeneralLinguistics) return false;

    const sequentialJapaneseStylistics =
      r.day === 'Чт' && r.time === '13:00' && room === '319 а' &&
      (
        (r.teacher === 'Быкова Стелла Артемьевна' && e.teacher === 'Крнета Наталия') ||
        (r.teacher === 'Крнета Наталия' && e.teacher === 'Быкова Стелла Артемьевна')
      ) &&
      norm(r.discipline).includes('стилист') &&
      norm(e.discipline).includes('стилист') &&
      (
        ((r.extra || '').includes('до 15.10.2026') && (e.extra || '').includes('после 15.10.2026')) ||
        ((e.extra || '').includes('до 15.10.2026') && (r.extra || '').includes('после 15.10.2026'))
      );
    if(sequentialJapaneseStylistics) return false;

    const extractWeeks = x => {
      const txt = (x.extra || '').toString();
      const m = txt.match(/недели:\s*([0-9,\s]+)/i);
      if(!m) return null;
      const nums = (m[1].match(/\d+/g) || []).map(Number);
      return nums.length ? new Set(nums) : null;
    };
    const rw = extractWeeks(r);
    const ew = extractWeeks(e);
    const sequentialByWeeks =
      norm(r.discipline) === norm(e.discipline) &&
      norm(r.group) === norm(e.group) &&
      rw && ew && [...rw].every(w => !ew.has(w));
    if(sequentialByWeeks) return false;

    const jointText = [
      r.extra || '', r.quality || '',
      e.extra || '', e.quality || ''
    ].join(' ').toLowerCase();

    const intentionalCoTeaching =
      norm(r.discipline) === norm(e.discipline) &&
      (
        isJointReading(r) ||
        isJointReading(e) ||
        (
          norm(r.group) === norm(e.group) &&
          (
            jointText.includes('совмест') ||
            jointText.includes('последователь') ||
            jointText.includes('один общий слот') ||
            jointText.includes('единый лекционный слот') ||
            jointText.includes('единый семинарский слот')
          )
        )
      );

    if(intentionalCoTeaching) return false;
    return true;
  });
}

function runRoomSearch(){
  const resultsEl = document.getElementById('results');
  const statusEl = document.getElementById('status');
  document.getElementById('printTitle').textContent = '';
  document.getElementById('pdfBtn').classList.remove('show');
  resultsEl.innerHTML = '';

  if(!pickedDay || !pickedTime){
    statusEl.textContent = 'Выберите день и время.';
    return;
  }

  // find rooms confirmed busy (single, unambiguous room only) at this day/time
  const busy = {}; // room -> [{teacher, group, discipline}]
  DATA.forEach(r => {
    if(r.day !== pickedDay || r.time !== pickedTime) return;
    const room = singleRoom(r.room_hint);
    if(!room) return;
    if(!busy[room]) busy[room] = [];
    busy[room].push({teacher:r.teacher, group:r.group, discipline:r.discipline});
  });

  const busyRooms = Object.keys(busy).sort((a,b)=>a.localeCompare(b,'ru'));
  const freeRooms = ALL_ROOMS.filter(rm => !busy[rm]).sort((a,b)=>a.localeCompare(b,'ru'));

  statusEl.innerHTML = '<b>' + dayFull(pickedDay) + ', ' + pickedTime + '</b> — вероятно свободно кабинетов: ' + freeRooms.length + ' из ' + ALL_ROOMS.length;
  document.getElementById('printTitle').textContent = 'Свободные аудитории — ' + dayFull(pickedDay) + ', ' + pickedTime + ' — осень 2026–2027, ИСАА МГУ';
  document.getElementById('pdfBtn').classList.add('show');

  const sec1 = document.createElement('div');
  sec1.className = 'room-result-section';
  sec1.innerHTML = '<div class="room-result-heading">🟢 Похоже, свободны</div>';
  const chips1 = document.createElement('div');
  chips1.className = 'room-chip-list';
  freeRooms.forEach(rm => {
    const chip = document.createElement('div');
    chip.className = 'room-chip free';
    chip.innerHTML = `<b>${rm}</b>`;
    chips1.appendChild(chip);
  });
  sec1.appendChild(chips1);
  resultsEl.appendChild(sec1);

  const sec2 = document.createElement('div');
  sec2.className = 'room-result-section';
  sec2.innerHTML = '<div class="room-result-heading">⚪ Точно заняты</div>';
  const chips2 = document.createElement('div');
  chips2.className = 'room-chip-list';
  busyRooms.forEach(rm => {
    const who = [...new Set(busy[rm].map(b => b.teacher))].join(', ');
    const chip = document.createElement('div');
    chip.className = 'room-chip busy';
    chip.innerHTML = `<b>${rm}</b><small>${who}</small>`;
    chips2.appendChild(chip);
  });
  sec2.appendChild(chips2);
  resultsEl.appendChild(sec2);
}

qInput.addEventListener('input', () => {

  const val = qInput.value.trim();
  if(!val){
    suggestList.classList.remove('open'); suggestList.innerHTML = '';
    showEmpty(); clearBtn.classList.remove('show'); return;
  }
  const q = norm(val);
  const items = currentItems();
  const matches = items.filter(it => norm(it.search || it.display).includes(q)).slice(0, 12);
  if(matches.length){
    suggestList.innerHTML = matches.map(it => `<button class="suggest-item" data-key="${escapeAttr(it.key)}">${it.display}</button>`).join('');
    suggestList.classList.add('open');
  } else {
    suggestList.innerHTML = '<div class="suggest-item" style="cursor:default;color:#6b6459;">Совпадений нет — попробуйте другое слово</div>';
    suggestList.classList.add('open');
  }
  clearBtn.classList.add('show');
});

suggestList.addEventListener('click', e => {
  const btn = e.target.closest('.suggest-item[data-key]');
  if(!btn) return;
  selectItem(btn.dataset.key);
});

clearBtn.addEventListener('click', () => {
  qInput.value = '';
  suggestList.classList.remove('open'); suggestList.innerHTML = '';
  clearBtn.classList.remove('show'); showEmpty(); qInput.focus();
});

function escapeAttr(s){
  return String(s ?? '').replace(/"/g,'&quot;');
}

function selectItem(key){
  const items = currentItems();
  const found = items.find(it => it.key === key);
  qInput.value = found ? found.display : key;
  suggestList.classList.remove('open');
  clearBtn.classList.add('show');
  showSchedule(key);
  window.scrollTo({top: document.querySelector('.status').offsetTop - 20, behavior:'smooth'});
}

function browseText(open){
  if(MODE === 'teacher') return open ? 'Скрыть список преподавателей' : 'Показать список всех преподавателей';
  if(MODE === 'course') return open ? 'Скрыть курсы' : 'Показать все курсы';
  if(MODE === 'discipline') return open ? 'Скрыть дисциплины' : 'Показать все дисциплины';
  if(MODE === 'department') return open ? 'Скрыть список кафедр' : 'Показать список всех кафедр';
  return open ? 'Скрыть список групп' : 'Показать список всех групп';
}
browseToggle.addEventListener('click', () => {
  const open = browseList.classList.toggle('open');
  browseToggle.textContent = browseText(open);
});

function buildBrowseList(){
  let html = ''; let lastLetter = '';
  const items = currentItems();
  items.forEach(it => {
    if(MODE !== 'course'){
      const letter = norm(it.display).charAt(0).toUpperCase();
      if(letter !== lastLetter){ html += `<div class="letter-heading">${letter.toUpperCase()}</div>`; lastLetter = letter; }
    }
    html += `<button class="browse-name" data-key="${escapeAttr(it.key)}">${it.display}</button>`;
  });
  browseList.innerHTML = html;
}
browseList.addEventListener('click', e => {
  const btn = e.target.closest('.browse-name[data-key]');
  if(!btn) return;
  browseList.classList.remove('open');
  browseToggle.textContent = browseText(false);
  selectItem(btn.dataset.key);
});

function showEmpty(){
  document.getElementById('results').innerHTML = '';
  document.getElementById('printTitle').textContent = '';
  document.getElementById('pdfBtn').classList.remove('show');
  if(MODE === 'room'){
    document.getElementById('status').textContent = 'Выберите день и время.';
    return;
  }
  const count = MODE === 'teacher'
    ? TEACHERS.length
    : (MODE === 'course'
        ? COURSE_ITEMS.length
        : (MODE === 'discipline'
            ? DISCIPLINE_ITEMS.length
            : (MODE === 'department' ? DEPARTMENTS.length : GROUP_ITEMS.length)));

    ? 'преподавателей'

            : (MODE === 'department' ? 'кафедр' : 'групп')));

    ? 'Всего ' + noun + ': ' + count + '. Начните вводить запрос или откройте список ниже.'
    : '';

const LANGUAGE_STEMS = {
  'арабский':['араб'], 'китайский':['китай'], 'японский':['япон'], 'персидский':['персид'],
  'турецкий':['турец'], 'хинди':['хинди'], 'иврит':['иврит'], 'корейский':['корей'],
  'африкаанс':['африкаанс'], 'суахили':['суахили'], 'малайский':['малай'], 'индонезийский':['индонез'],
  'филиппинский':['филиппин'], 'вьетнамский':['вьетнам'], 'грузинский':['грузин'], 'пушту':['пушту'],
  'дари':['дари'], 'хауса':['хауса'], 'урду':['урду'], 'амхарский':['амхар'], 'армянский':['армян'], 'тайский':['тайск']
};
const DIRECTION_STEMS = {
  'история':['истор'], 'политология':['политолог'], 'филология':['филолог'], 'экономика':['эконом'],
  'литературы':['литератур'], 'языки':['лингвист','язык']
};
const DISCIPLINE_LANGUAGE_STEMS = {
  'арабский':['араб'], 'китайский':['китай','тайван'], 'японский':['япон'], 'персидский':['персид','иран'],
  'турецкий':['турец','турц'], 'хинди':['хинди'], 'иврит':['иврит'], 'корейский':['корей'],
  'африкаанс':['африкаанс'], 'суахили':['суахили'], 'малайский':['малай'], 'индонезийский':['индонез'],
  'филиппинский':['филиппин'], 'вьетнамский':['вьетнам'], 'грузинский':['грузин','грузи'], 'пушту':['пушту'],
  'дари':['дари'], 'хауса':['хауса'], 'урду':['урду'], 'амхарский':['амхар'], 'армянский':['армян'], 'тайский':['тайск','таиланд']
};
function detectCategory(value, mapping){
  const s = norm(value);
  for(const [cat, stems] of Object.entries(mapping)){
    if(stems.some(st => s.includes(st))) return cat;
  }
  return '';
}
function detectSet(value, mapping){
  const s = norm(value); const found = new Set();
  for(const [cat, stems] of Object.entries(mapping)){
    if(stems.some(st => s.includes(st))) found.add(cat);
  }
  return found;
}
function groupMeta(code){
  const exact = DATA.find(r => r.group === code);
  if(exact) return {course: exact.course || '', direction: exact.direction || '', language: exact.extra || ''};
  const label = GROUP_LABELS[code] || '';
  const parts = label.split('·').map(x => x.trim());
  return {
    course: parts[0] || '',
    direction: parts[1] || '',
    language: (parts[2] || '').split('(')[0].trim()
  };
}
function fullGroupMatches(code){
  const meta = groupMeta(code);
  const selectedCourse = norm(meta.course);
  const selectedDirection = detectCategory(meta.direction, DIRECTION_STEMS);
  const selectedLanguage = detectCategory(meta.language, LANGUAGE_STEMS);
  const codeNorm = norm(code);
  return DATA.filter(r => {
    const g = norm(r.group);
    if(g === codeNorm || (codeNorm && g.includes(codeNorm))) return true;
    // Если в строке перечислены конкретные коды других групп, не пытаемся угадывать соответствие.
    if(/\b\d{2}\s*[бм]\s*[\/\\]/i.test(g)) return false;
    if(!selectedCourse || norm(r.course) !== selectedCourse) return false;
    if(!g || ['-','nan','не знаю'].includes(g)) return false;

    const rowDirections = detectSet(g, DIRECTION_STEMS);
    const rowLanguages = detectSet(g, LANGUAGE_STEMS);
    const disciplineLanguages = detectSet((r.discipline || '') + ' ' + (r.extra || ''), DISCIPLINE_LANGUAGE_STEMS);
    if(rowDirections.size && selectedDirection && !rowDirections.has(selectedDirection)) return false;
    if(rowLanguages.size && selectedLanguage && !rowLanguages.has(selectedLanguage)) return false;
    if(rowLanguages.size && !selectedLanguage) return false;
    // Если группа описана слишком общо, но сама дисциплина явно относится к другой стране/языку — не подмешиваем её.
    if(!rowLanguages.size && disciplineLanguages.size && selectedLanguage && !disciplineLanguages.has(selectedLanguage)) return false;

    const wholeCourse = ['весь поток','весь курс','все студенты','все направления','весь 1-й курс','весь 2-й курс','весь 3-й курс','весь 4-й курс']
      .some(x => g.includes(x));
    if(wholeCourse) return true;

    const broadMarker = /\b(все|весь|поток|групп)/.test(g);
    if(selectedDirection && rowDirections.has(selectedDirection) && broadMarker) return true;
    // Если одновременно явно указаны и направление, и язык — это достаточно точное сопоставление.
    if(selectedDirection && selectedLanguage && rowDirections.has(selectedDirection) && rowLanguages.has(selectedLanguage)) return true;
    // Общая дисциплина для нескольких направлений без привязки к языку.
    if(selectedDirection && rowDirections.has(selectedDirection) && rowDirections.size >= 2 && !rowLanguages.size) return true;
    // Языковая общая группа, например «арабские группы (историки, экономисты, ...)».
    if(selectedLanguage && rowLanguages.has(selectedLanguage) && broadMarker){
      if(!rowDirections.size || !selectedDirection || rowDirections.has(selectedDirection)) return true;
    }
    return false;
  });
}
function departmentMatches(department){
  return DATA.filter(r => teacherDepartments(r.teacher).includes(department));
}

function showSchedule(key){
  const resultsEl = document.getElementById('results');
  const statusEl = document.getElementById('status');
  resultsEl.innerHTML = '';
  const matches = MODE === 'teacher'
    ? DATA.filter(r => r.teacher === key)
    : (MODE === 'course'
        ? DATA.filter(r => (r.course || '') === key)
        : (MODE === 'discipline'
            ? DATA.filter(r => norm(r.discipline) === key)
            : (MODE === 'department' ? departmentMatches(key) : fullGroupMatches(key))));

  const disciplineItem = DISCIPLINE_ITEMS.find(it => it.key === key);
  const displayName = MODE === 'teacher'
    ? key
    : (MODE === 'course'
        ? courseDisplay(key)
        : (MODE === 'discipline'
            ? (disciplineItem ? disciplineItem.display : key)
            : (MODE === 'department' ? departmentLabel(key) : (GROUP_LABELS[key] || key))));

  if(matches.length === 0){
    statusEl.innerHTML = 'Занятий не найдено для «<b>'+displayName+'</b>».';
    resultsEl.innerHTML = '<div class="empty">Попробуйте выбрать другой вариант из списка.</div>';
    document.getElementById('printTitle').textContent = '';
    document.getElementById('pdfBtn').classList.remove('show');
    return;
  }

  // объединяем записи, которые совпадают по дню/времени/предмету/языку/преподавателю —
  // это одно и то же занятие для нескольких групп, показываем один раз со списком групп
  const merged = {};
  matches.forEach(r => {
    const mkey = [r.day, r.time, r.course||'', r.discipline, r.extra||'', r.teacher, r.room_hint||''].join('|||');
    if(!merged[mkey]){
      merged[mkey] = {...r, groups: [r.group]};
    } else {
      if(!merged[mkey].groups.includes(r.group)) merged[mkey].groups.push(r.group);
    }
  });
  const mergedList = Object.values(merged);

  statusEl.innerHTML = '<b>' + displayName + '</b> — занятий: ' + mergedList.length;
  if(MODE === 'student'){
    const exactCount = DATA.filter(r => r.group === key).length;
    statusEl.innerHTML += '<br><span style="font-size:15px;color:var(--muted)">Полное расписание группы: включены ' + exactCount + ' точных строк группы и общие занятия потока/направления, которые можно однозначно сопоставить по текущей базе.</span>';
  }
  if(MODE === 'course'){
    statusEl.innerHTML += '<br><span style="font-size:15px;color:var(--muted)">Показаны все занятия этого курса без выбора отдельной группы. Одинаковые занятия, назначенные нескольким группам, объединены в одну карточку; внутри карточки перечислены группы, которых касается занятие.</span>';
  }
  if(MODE === 'discipline'){
    const disciplineTeachers = [...new Set(matches.map(r => r.teacher).filter(Boolean))];
    const disciplineGroups = [...new Set(matches.map(r => r.group).filter(Boolean))];
    statusEl.innerHTML += '<br><span style="font-size:15px;color:var(--muted)">Показано полное расписание дисциплины по всей базе: все курсы, группы, преподаватели и аудитории. Преподавателей: ' + disciplineTeachers.length + '; записей групп/потоков: ' + disciplineGroups.length + '.</span>';
  }
  if(MODE === 'department'){
    const staff = TEACHERS.filter(t => teacherDepartments(t).includes(key));
    statusEl.innerHTML += '<br><span style="font-size:15px;color:var(--muted)">Преподавателей кафедры, найденных в расписании: ' + staff.length + '. Принадлежность к кафедрам взята из сводной таблицы пожеланий и профильных кафедральных планов.</span>';
  }
  if(MODE === 'department' && key === 'западноевропейских языков'){
    statusEl.innerHTML += '<br><span style="font-size:15px;color:var(--muted)">Для кафедры добавлены подтверждённые планы 2, 3 и 4 курса и аспирантуры на осень 2026/27 с конкретными аудиториями. Магистратура из кафедрального файла не перенесена: её вкладка относится к осени 2025/26.</span>';
  }
  if(MODE === 'teacher' && displayName === 'Фурсов Кирилл Андреевич'){
    statusEl.innerHTML += '<br><span style="font-size:16px;color:var(--muted)">Регулярные пары сгруппированы в пятницу. Отдельно: 2 поточные лекции в октябре по курсу «История стран Азии и Африки в Новейшее время», аудитория 128; конкретные даты и время уточняются, среда исключена.</span>';
  }
  document.getElementById('printTitle').textContent = 'Расписание: ' + displayName + ' — осень 2026–2027, ИСАА МГУ';
  document.getElementById('pdfBtn').classList.add('show');

  const byDay = {};
  mergedList.forEach(r => { if(!byDay[r.day]) byDay[r.day] = []; byDay[r.day].push(r); });

  DAY_ORDER.forEach(day => {
    if(!byDay[day]) return;
    const group = document.createElement('div');
    group.className = 'day-group';
    const title = document.createElement('div');
    title.className = 'day-title';
    title.textContent = dayFull(day);
    group.appendChild(title);
    byDay[day].sort((a,b) => timeOrder(a.time) - timeOrder(b.time));
    byDay[day].forEach(r => group.appendChild(card(r)));
    resultsEl.appendChild(group);
  });

  const unresolved = Object.keys(byDay).filter(day => !DAY_ORDER.includes(day));
  unresolved.forEach(day => {
    const group = document.createElement('div');
    group.className = 'day-group';
    const title = document.createElement('div');
    title.className = 'day-title';
    title.textContent = 'Требует уточнения';
    group.appendChild(title);
    byDay[day].sort((a,b) => timeOrder(a.time) - timeOrder(b.time));
    byDay[day].forEach(r => group.appendChild(card(r)));
    resultsEl.appendChild(group);
  });
}

function dayFull(d){
  const map = {'Пн':'Понедельник','Вт':'Вторник','Ср':'Среда','Чт':'Четверг','Пт':'Пятница','Сб':'Суббота'};
  return map[d] || d;
}
function timeOrder(t){
  const order = ['9:00','10:40','13:00','14:40','16:20','17:00','18:00','19:40','20:00'];
  const i = order.indexOf(t);
  return i === -1 ? 99 : i;
}

function card(r){
  const el = document.createElement('div');
  const conflicts = findConflicts(r);
  const qualityText = (r.quality || '');
  const conflictMatch = qualityText.match(/КОНФЛИКТ[:.]\s*(.*)$/);
  const flaggedConflict = !!conflictMatch;
  const jointReading = isJointReading(r);
  const codeWarning = qualityText.includes('ПРОВЕРИТЬ КОД ГРУППЫ') ||
                      qualityText.includes('КОДЫ 22Б требуют отдельной актуализации');
  const hasRealConflict = conflicts.length || flaggedConflict;
  el.className = 'card' + (hasRealConflict ? ' card-conflict' : (jointReading ? ' card-joint' : ''));

  // --- room state: confirmed single room / multiple candidates / unknown ---
  const hint = (r.room_hint || '').trim();
  let roomHtml;
  if(!hint || hint.includes('нет данных')){
    roomHtml = `<span class="room-pill room-unknown">Аудитория неизвестна</span>`;
  } else if(hint.includes(',')){
    const options = hint.split(',').map(s => s.trim()).filter(Boolean).join(', ');
    roomHtml = `<span class="room-pill room-guess">${options}</span>`;
  } else {
    roomHtml = `<span class="room-pill room-sure">Аудитория ${hint}</span>`;
  }

  const jointReaders = jointReading ? getJointReaders(r) : [];
  const jointReadingHtml = jointReading
    ? `<div class="joint-reading">${
        jointReaders.length
          ? `Совместное чтение с: ${jointReaders.join(', ')}`
          : 'Совместное чтение; состав со-преподавателей уточняется'
      }</div>`
    : '';

  let conflictHtml = '';
  if(conflicts.length){
    const names = [...new Set(conflicts.map(c => c.teacher + ' — ' + c.group))].join('; ');
    conflictHtml = `<div class="conflict-warn">⚠ Пересечение с: ${names}</div>`;
  }
  if(flaggedConflict){
    const explicitConflict = (conflictMatch[1] || '').trim();
    conflictHtml += `<div class="conflict-warn">⚠ КОНФЛИКТ: ${explicitConflict}</div>`;
  }

  let codeWarningHtml = '';
  if(codeWarning){
    codeWarningHtml = `<div class="code-warn">⚠ Код группы взят из старой заявки и требует актуализации. Автоматическая замена 22Б → 23Б не выполнена без подтверждённого полного шифра.</div>`;
  }
  const teacherHtml = r.teacher
    ? `<span class="lbl">Преподаватель:</span> <button class="teacher-link" data-teacher="${escapeAttr(r.teacher)}">${r.teacher}</button>`
    : '';
  const rawGroups = r.groups || [r.group];
  const groupsList = rawGroups
    .filter(g => g !== null && g !== undefined && !(typeof g === 'number' && Number.isNaN(g)))
    .map(g => String(g).trim())
    .filter(g => g && g.toLowerCase() !== 'nan');
  const groupLabel = groupsList.length > 1 ? 'Группы:' : 'Группа:';
  const groupsHtml = groupsList.length
    ? groupsList.map(g => GROUP_LABELS[g] ? `<button class="group-code group-link" data-group="${escapeAttr(g)}" title="Показать полное расписание группы">${g}</button>` : `<span class="group-code">${g}</span>`).join(' ')
    : '<span class="group-code">не указана</span>';
  el.innerHTML = `
    <div class="row1">
      <span class="time">${r.time}</span>
      <span class="discipline">${r.discipline}${r.extra ? ' — ' + r.extra : ''}</span>
    </div>
    <div class="details">
      <span class="lbl">${groupLabel}</span> ${groupsHtml}
      ${teacherHtml ? '&nbsp;·&nbsp; ' + teacherHtml : ''}
    </div>
    <div class="room-row">${roomHtml}</div>
    ${jointReadingHtml}
    ${conflictHtml}
    ${codeWarningHtml}
  `;
  return el;
}

document.getElementById('results').addEventListener('click', e => {
  const teacherBtn = e.target.closest('.teacher-link[data-teacher]');
  if(teacherBtn){
    switchMode('teacher');
    qInput.value = teacherBtn.dataset.teacher;
    clearBtn.classList.add('show');
    showSchedule(teacherBtn.dataset.teacher);
    window.scrollTo({top: 0, behavior:'smooth'});
    return;
  }
  const groupBtn = e.target.closest('.group-link[data-group]');
  if(groupBtn){
    switchMode('student');
    const key = groupBtn.dataset.group;
    qInput.value = GROUP_LABELS[key] || key;
    clearBtn.classList.add('show');
    showSchedule(key);
    window.scrollTo({top: 0, behavior:'smooth'});
  }
});

buildBrowseList();
document.getElementById('status').textContent = 'Всего преподавателей: ' + TEACHERS.length + '. Можно искать преподавателя, полное расписание группы, расписание всего курса, расписание кафедры или аудиторию.';
</script>
</body>
</html>
