<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Расписание ИСАА — найти своё</title>
<style>
  body{font-family:Georgia,"Times New Roman",serif;background:#faf7f0;color:#1f2a24;padding:32px;line-height:1.5}
  .load{max-width:720px;margin:10vh auto;background:#fff;border:1px solid #e2d9c8;border-radius:14px;padding:24px}
</style>
</head>
<body>
<div class="load" id="loader">Загружаю актуальное расписание 2026–2027…</div>
<script>
(async function(){
  const frozenBase='https://raw.githubusercontent.com/tanyalapkhan-commits/isaa-raspisanie/0411abf15a672017371701a0adf99089a8747309/index.html';
  try{
    const response=await fetch(frozenBase,{cache:'no-store'});
    if(!response.ok) throw new Error('HTTP '+response.status);
    let html=await response.text();
    const injection='<script src="hotfix-20260831.js?v=20260831-2"><'+'/script>\n<script src="hotfix-kaimova-20260831.js?v=20260831-1"><'+'/script>\n<script src="restore-student-tabs-20260831.js?v=20260831-1"><'+'/script>\n<script src="public-cleanup-20260831.js?v=20260831-1"><'+'/script>';
    if(html.includes('</body>')) html=html.replace('</body>',injection+'\n</body>');
    else html+=injection;
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.getElementById('loader').innerHTML='<b>Не удалось загрузить расписание.</b><br>Обновите страницу через несколько секунд. Техническая ошибка: '+String(err.message||err);
  }
})();
</script>
</body>
</html>
